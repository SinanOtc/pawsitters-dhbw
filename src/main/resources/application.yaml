# Base-Config — gilt für alle Profile.
# Profil-spezifische Overrides stehen in den --- Blöcken unten
# (dev = H2 In-Memory, test = isolierte H2, prod = PostgreSQL via Env-Vars).
spring:
  application:
    name: pawsitters
  profiles:
    active: dev
  thymeleaf:
    cache: false
  jpa:
    open-in-view: false

server:
  # PORT-Env-Var von der Hosting-Plattform (Railway/Fly) — Fallback 8080 lokal
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    dhbw.heilbronn.pawsitters: DEBUG

# === ACTUATOR ===
  # Nur /health und /info öffentlich exponiert; sensible Endpoints
  # (env, beans, configprops, ...) bleiben standardmäßig deaktiviert.
  # Health-Details nur für authentifizierte User — Railway-Probe bekommt
  # bloß "UP", eingeloggte Entwickler sehen DB/Disk-Status für Debugging.

management:
  endpoints:
    web:
      exposure:
        include: health.info
  endpoint:
    health:
      show-details: when-authorized
---
# === DEV-Profil ===
# H2 in-memory, Schema wird beim Start automatisch erstellt.
# DevUsersConfig seedet Demo-Daten.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:pawsitters;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# === TEST-Profil ===
# Isolierte H2 Instanz pro Test-Lauf, kein Seed.
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:pawsitters-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# === PROD-Profil ===
# PostgreSQL via Standard-PG*-Env-Vars (Railway setzt sie automatisch
# wenn der Postgres-Service als Reference verlinkt wird).
# Flyway managed das Schema (V1__init_schema.sql + folgende Migrations).
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
