# Base-Config — gilt für alle Profile.
# Profil-spezifische Overrides stehen in den --- Blöcken unten
# (dev = H2 In-Memory, test = isolierte H2, prod = PostgreSQL via Env-Vars).
spring:
  application:
    name: pawsitters
  profiles:
    active: dev
  thymeleaf:
    cache: false
  jpa:
    open-in-view: false

server:
  # PORT-Env-Var von der Hosting-Plattform (Railway/Fly) — Fallback 8080 lokal
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

logging:
  level:
    root: INFO
    dhbw.heilbronn.pawsitters: DEBUG

---
# === DEV-Profil ===
# H2 in-memory, Schema wird beim Start automatisch erstellt.
# DevUsersConfig seedet Demo-Daten.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pawsitters;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# === TEST-Profil ===
# Isolierte H2 Instanz pro Test-Lauf, kein Seed.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:pawsitters-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# === PROD-Profil ===
# PostgreSQL via Env-Vars (Railway/Fly.io setzt DATABASE_URL).
# Flyway managed das Schema (kommt in nächster Phase).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
