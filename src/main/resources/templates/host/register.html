<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrieren</title>
</head>
<body>
    <h1>Host Registrierung</h1>

    <!-- th:object => bindet das Formular an registerForm Model-Attribut -->
    <!-- th:action => wird per Thymeleaf mit Context Path versehen, post -->

    <form th:action="@{/host/register}" th:object="${registerForm}" method="post">

        <!-- CSRF Token, von Spring Security verlangt -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <p>
            <label>E-Mail:
                <input type="email" th:field="*{email}" required>
            </label>
            <!-- Fehlermeldung aus BindingResult zu "email" -->
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span>
        </p>

        <p>
            <label>Passwort:
                <input type="password" th:field="*{password}" required>
            </label>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span>
        </p>

        <p>
            <label>Vorname:
                <input type="text" th:field="*{firstName}" required>
            </label>
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:red"></span>
        </p>

        <p>
            <label>Nachname:
                <input type="text" th:field="*{lastName}" required>
            </label>
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:red"></span>
        </p>

        <p>
            <label>Adresse:
                <input type="text" th:field="*{address}" required>
            </label>
            <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color:red;"></span>
        </p>

        <fieldset>
            <legend>Akzeptierte Tierarten</legend>
            <!-- mehrere Checkboxen mit gleichem name => Spring bindet die ausgewählten Werte als Set -->
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="DOG"> Hund</label>
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="CAT"> Katze</label>
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="BIRD"> Vogel</label>
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="RABBIT"> Kaninchen</label>
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="REPTILE"> Reptil</label>
            <label><input type="checkbox" th:field="*{acceptedSpecies}" value="OTHER"> Andere</label>
            <span th:if="${#fields.hasErrors('acceptedSpecies')}" th:errors="*{acceptedSpecies}" style="color:red;"></span>
        </fieldset>

        <p>
            <label>Verfügbar ab:
                <input type="date" th:field="*{availableFrom}" required>
            </label>
            <span th:if="${#fields.hasErrors('availableFrom')}" th:errors="*{availableFrom}" style="color:red;"></span>
        </p>

        <p>
            <label>Verfügbar bis:
                <input type="date" th:field="*{availableUntil}" required>
            </label>
            <span th:if="${#fields.hasErrors('availableUntil')}" th:errors="*{availableUntil}" style="color:red;"></span>
        </p>

        <p>
            <label>Preis pro Woche (€):
                <input type="number" step="0.01" min="0" th:field="*{pricePerWeek}" required>
            </label>
            <span th:if="${#fields.hasErrors('pricePerWeek')}" th:errors="*{pricePerWeek}" style="color:red;"></span>
        </p>

        <button type="submit">Registrieren</button>
    </form>

    <p><a th:href="@{/login}">Bereits registriert? Zum Login</a></p>

</body>
</html>
