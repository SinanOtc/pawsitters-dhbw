<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profil bearbeiten</title>
</head>
<body>
<h1>Profil bearbeiten</h1>

<form th:action="@{/host/profile/edit}" th:object="${updateForm}" method="post">

  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <p>
    <label>Vorname:
      <input type="text" th:field="*{firstName}" required>
    </label>
    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
          style="color:red;"></span>
  </p>

  <p>
    <label>Nachname:
      <input type="text" th:field="*{lastName}" required>
    </label>
    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
          style="color:red;"></span>
  </p>

  <p>
    <label>Adresse:
      <input type="text" th:field="*{address}" required>
    </label>
    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
          style="color:red;"></span>
  </p>

  <fieldset>
    <legend>Akzeptierte Tierarten</legend>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="DOG"> Hund</label>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="CAT"> Katze</label>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="BIRD"> Vogel</label>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="RABBIT"> Kaninchen</label>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="REPTILE"> Reptil</label>
    <label><input type="checkbox" th:field="*{acceptedSpecies}" value="OTHER"> Andere</label>
    <span th:if="${#fields.hasErrors('acceptedSpecies')}" th:errors="*{acceptedSpecies}" style="color:red;"></span>
  </fieldset>

  <p>
    <label>Verfügbar ab:
      <input type="date" th:field="*{availableFrom}" required>
    </label>
    <span th:if="${#fields.hasErrors('availableFrom')}" th:errors="*{availableFrom}"
          style="color:red;"></span>
  </p>

  <p>
    <label>Verfügbar bis:
      <input type="date" th:field="*{availableUntil}" required>
    </label>
    <span th:if="${#fields.hasErrors('availableUntil')}" th:errors="*{availableUntil}"
          style="color:red;"></span>
  </p>

  <p>
    <label>Preis pro Woche (€):
      <input type="number" step="0.01" min="0" th:field="*{pricePerWeek}" required>
    </label>
    <span th:if="${#fields.hasErrors('pricePerWeek')}" th:errors="*{pricePerWeek}"
          style="color:red;"></span>
  </p>

  <button type="submit">Speichern</button>
</form>

<p><a th:href="@{/host/profile}">Abbrechen</a></p>
</body>
</html>
