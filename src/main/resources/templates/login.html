<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <!-- Fehlermeldung, falls Spring Security den Login ablehnt -->
    <p th:if="${param.error}" style="color:red;">Login fehlgeschlagen</p>
    <p th:if="${param.logout}" style="color:green;">Du wurdest ausgeloggt.</p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>E-Mail:
            <input type="email" name="username" required>
        </label>
        <br>
        <label>Passwort:
            <input type="password" name="password" required>
        </label>
        <br>
        <button type="submit">Anmelden</button>
    </form>
</body>
</html>
