<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Login</title>
</head>
<body>
<section>
    <h1>Login</h1>
    <p th:if="${param.error}" class="message message-error">Login fehlgeschlagen.</p>
    <p th:if="${param.logout}" class="message message-success">Du wurdest ausgeloggt.</p>
    <p th:if="${param.registered}" class="message message-success">Registrierung erfolgreich. Bitte einloggen.</p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p>
            <label for="username">E-Mail</label>
            <input id="username" type="email" name="username" required>
        </p>
        <p>
            <label for="password">Passwort</label>
            <input id="password" type="password" name="password" required>
        </p>
        <button type="submit">Anmelden</button>
    </form>
</section>
</body>
</html>
