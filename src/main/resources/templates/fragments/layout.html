<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Pawsitters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header" th:fragment="header">
    <a th:href="@{/}" class="brand">Pawsitters</a>

    <nav class="navbar" th:fragment="navbar">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/owner/profile}">Profil</a>
        <a th:href="@{/owner/care-requests}">Anfragen</a>
        <a th:href="@{/owner/offers}">Angebote</a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}"
              method="post"
              class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="content">
    <th:block th:replace="${content}">
        <h1>Pawsitters</h1>
        <p>Willkommen bei Pawsitters.</p>
    </th:block>
</main>

<footer class="site-footer" th:fragment="footer">
    <small>&copy; 2026 Pawsitters &middot; DHBW Heilbronn</small>
</footer>

</body>
</html>
