<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Pawsitters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header" th:fragment="header">
    <a th:href="@{/}" class="brand">
        <svg class="brand-logo" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false"
             xmlns="http://www.w3.org/2000/svg">
            <!-- Sonnenschirm -->
            <rect x="23.1" y="20" width="1.8" height="15" rx="0.9" fill="#8a6d3b"/>
            <path d="M5 21 C5 11.5 13 6.5 24 6.5 C35 6.5 43 11.5 43 21 Z" fill="var(--pw-accent)"/>
            <path d="M24 6.5 L12 21 L19 21 Z" fill="var(--pw-bg-page)"/>
            <path d="M24 6.5 L29 21 L36 21 Z" fill="var(--pw-bg-page)"/>
            <circle cx="24" cy="6.5" r="1.6" fill="var(--pw-accent-dim)"/>
            <!-- Hund -->
            <path d="M28.5 38.5 C31.5 38.5 32.5 35.5 31 33.5" fill="none"
                  stroke="#b0682d" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M19.5 40 C19.5 34.5 21.5 32 24 32 C26.5 32 28.5 34.5 28.5 40 Z" fill="#b0682d"/>
            <path d="M20 27 C18.2 27.5 18.5 31.5 20.5 32 C21 29.5 20 28 20.8 27 Z" fill="#935323"/>
            <path d="M28 27 C29.8 27.5 29.5 31.5 27.5 32 C27 29.5 28 28 27.2 27 Z" fill="#935323"/>
            <circle cx="24" cy="30" r="4.8" fill="#b0682d"/>
            <ellipse cx="24" cy="31.5" rx="2.2" ry="1.7" fill="#d2904f"/>
            <circle cx="24" cy="30.6" r="0.9" fill="#2e2418"/>
            <circle cx="22" cy="29" r="0.8" fill="#2e2418"/>
            <circle cx="26" cy="29" r="0.8" fill="#2e2418"/>
        </svg>
        <span>Pawsitters</span>
    </a>

    <nav class="navbar" th:fragment="navbar">
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>

        <a sec:authorize="hasRole('OWNER')" th:href="@{/owner/profile}">Profil</a>
        <a sec:authorize="hasRole('OWNER')" th:href="@{/owner/pets}">Haustiere</a>
        <a sec:authorize="hasRole('OWNER')" th:href="@{/owner/care-requests}">Anfragen</a>

        <a sec:authorize="hasRole('HOST')" th:href="@{/dashboard}">Dashboard</a>
        <a sec:authorize="hasRole('HOST')" th:href="@{/host/profile}">Profil</a>
        <a sec:authorize="hasRole('HOST')" th:href="@{/host/care-requests}">Anfragen</a>
        <a sec:authorize="hasRole('HOST')" th:href="@{/host/offers}">Angebote</a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}"
              method="post"
              class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="content">
    <th:block th:replace="${content}">
        <h1>Pawsitters</h1>
        <p>Willkommen bei Pawsitters.</p>
    </th:block>
</main>

<footer class="site-footer" th:fragment="footer">
    <small>&copy; 2026 Pawsitters &middot; DHBW Heilbronn</small>
</footer>

</body>
</html>
