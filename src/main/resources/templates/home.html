<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Pawsitters</title>
</head>
<body>
<section>
    <h1>Pawsitters</h1>
    <p>Tierbetreuung einfach organisieren.</p>
    <p>
        <a th:href="@{/login}">Zum Login</a>
    </p>

    <form method="get" class="role-selection">
        <fieldset>
            <legend>Registrieren als</legend>
            <div class="form-actions">
                <button type="submit" th:formaction="@{/owner/register}">PetOwner</button>
                <button type="submit" th:formaction="@{/host/register}">Host</button>
            </div>
        </fieldset>
    </form>
</section>
</body>
</html>
