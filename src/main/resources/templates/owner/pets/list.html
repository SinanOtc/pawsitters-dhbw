<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Haustiere</title>
</head>
<body>
<section>
    <h1>Haustiere</h1>

    <p class="form-actions">
        <a th:href="@{/owner/pets/new}">Haustier registrieren</a>
    </p>

    <p th:if="${#lists.isEmpty(pets)}">Es sind noch keine Haustiere registriert.</p>

    <table th:unless="${#lists.isEmpty(pets)}">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Tierart</th>
            <th scope="col">Rasse</th>
            <th scope="col">Geburtsjahr</th>
            <th scope="col">Besonderheiten</th>
            <th scope="col">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${pets}">
            <td th:text="${pet.name}">Bello</td>
            <td th:text="${#strings.capitalize(#strings.toLowerCase(pet.species.name()))}">Dog</td>
            <td th:text="${pet.breed ?: '-'}">Labrador</td>
            <td th:text="${pet.birthYear ?: '-'}">2020</td>
            <td th:text="${pet.description ?: '-'}">Verträgt sich gut mit Katzen.</td>
            <td>
                <a th:href="@{/owner/pets/{id}/edit(id=${pet.id})}">Bearbeiten</a>
                <form th:action="@{/owner/pets/{id}/delete(id=${pet.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
