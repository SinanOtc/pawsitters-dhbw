<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Registrieren</title>
</head>
<body>
<section>
    <h1>PetOwner Registrierung</h1>

    <form th:action="@{/owner/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p>
            <label for="email">E-Mail</label>
            <input type="email" th:field="*{email}" required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
        </p>

        <p>
            <label for="password">Passwort</label>
            <input type="password" th:field="*{password}" required>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
        </p>

        <p>
            <label for="firstName">Vorname</label>
            <input type="text" th:field="*{firstName}" required>
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></span>
        </p>

        <p>
            <label for="lastName">Nachname</label>
            <input type="text" th:field="*{lastName}" required>
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></span>
        </p>

        <p>
            <label for="address">Adresse</label>
            <input type="text" th:field="*{address}" required>
            <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="field-error"></span>
        </p>

        <button type="submit">Registrieren</button>
    </form>

    <p><a th:href="@{/login}">Bereits registriert? Zum Login</a></p>
</section>
</body>
</html>
