<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Registrieren</title>
</head>
<body>
<section>
    <h1>PetOwner-Profil erstellen</h1>

    <form th:action="@{/owner/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p>
            <label for="email">E-Mail</label>
            <input type="email"
                   th:field="*{email}"
                   autocomplete="email"
                   maxlength="254"
                   required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
        </p>

        <p>
            <label for="password">Passwort</label>
            <input type="password"
                   th:field="*{password}"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
        </p>

        <p>
            <label for="firstName">Vorname</label>
            <input type="text"
                   th:field="*{firstName}"
                   autocomplete="given-name"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></span>
        </p>

        <p>
            <label for="lastName">Nachname</label>
            <input type="text"
                   th:field="*{lastName}"
                   autocomplete="family-name"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></span>
        </p>

        <noscript>
            <p class="message message-success">
                JavaScript ist deaktiviert. Bitte die Adresse vollständig im Feld "Adresse" eingeben.
            </p>
        </noscript>

        <p data-address-fallback-group>
            <label for="address">Adresse</label>
            <input type="text"
                   th:field="*{address}"
                   autocomplete="street-address"
                   maxlength="256"
                   required
                   data-composed-address>
        </p>
        <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="field-error"></span>

        <div data-address-split hidden>
        <p>
            <label for="street">Straße</label>
            <input type="text"
                   id="street"
                   autocomplete="address-line1"
                   data-address-field="street"
                   maxlength="100">
        </p>

        <p>
            <label for="streetNumber">Straßennummer</label>
            <input type="text"
                   id="streetNumber"
                   autocomplete="address-line2"
                   data-address-field="streetNumber"
                   maxlength="20">
        </p>

        <p>
            <label for="postalCode">PLZ</label>
            <input type="text"
                   id="postalCode"
                   autocomplete="postal-code"
                   inputmode="numeric"
                   data-address-field="postalCode"
                   pattern="[0-9]{5}"
                   maxlength="5">
        </p>

        <p>
            <label for="city">Ort</label>
            <input type="text"
                   id="city"
                   autocomplete="address-level2"
                   data-address-field="city"
                   maxlength="100">
        </p>
        </div>

        <div class="form-actions">
            <button type="submit">Profil erstellen</button>
            <a th:href="@{/login}">Zum Login</a>
        </div>
    </form>
    <script th:src="@{/js/owner-address.js}"></script>
</section>
</body>
</html>
