<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
    <title>Registrieren</title>
</head>
<body>
<section>
    <h1>PetOwner-Profil erstellen</h1>

    <form th:action="@{/owner/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p>
            <label for="email">E-Mail</label>
            <input type="email"
                   th:field="*{email}"
                   autocomplete="email"
                   maxlength="254"
                   required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
        </p>

        <p>
            <label for="password">Passwort</label>
            <input type="password"
                   th:field="*{password}"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
        </p>

        <p>
            <label for="firstName">Vorname</label>
            <input type="text"
                   th:field="*{firstName}"
                   autocomplete="given-name"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></span>
        </p>

        <p>
            <label for="lastName">Nachname</label>
            <input type="text"
                   th:field="*{lastName}"
                   autocomplete="family-name"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></span>
        </p>

        <p>
            <label for="street">Straße</label>
            <input type="text"
                   th:field="*{street}"
                   autocomplete="address-line1"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('street')}" th:errors="*{street}" class="field-error"></span>
        </p>

        <p>
            <label for="streetNumber">Straßennummer</label>
            <input type="text"
                   th:field="*{streetNumber}"
                   autocomplete="address-line2"
                   maxlength="20"
                   required>
            <span th:if="${#fields.hasErrors('streetNumber')}" th:errors="*{streetNumber}" class="field-error"></span>
        </p>

        <p>
            <label for="postalCode">PLZ</label>
            <input type="text"
                   th:field="*{postalCode}"
                   autocomplete="postal-code"
                   inputmode="numeric"
                   pattern="[0-9]{5}"
                   required>
            <span th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}" class="field-error"></span>
        </p>

        <p>
            <label for="city">Ort</label>
            <input type="text"
                   th:field="*{city}"
                   autocomplete="address-level2"
                   maxlength="100"
                   required>
            <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="field-error"></span>
        </p>

        <div class="form-actions">
            <button type="submit">Profil erstellen</button>
            <a th:href="@{/login}">Zum Login</a>
        </div>
    </form>
</section>
</body>
</html>
