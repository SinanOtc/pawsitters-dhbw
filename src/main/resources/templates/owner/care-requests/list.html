<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
  <title>Betreuungsanfragen</title>
</head>
<body>
<section>
  <h1>Betreuungsanfragen</h1>

  <p><a th:href="@{/owner/care-requests/new}">Neue Anfrage erstellen</a></p>

  <p th:if="${#lists.isEmpty(careRequests)}">Es sind noch keine Betreuungsanfragen vorhanden.</p>

  <table th:unless="${#lists.isEmpty(careRequests)}">
    <thead>
    <tr>
      <th scope="col">Haustier</th>
      <th scope="col">Startdatum</th>
      <th scope="col">Enddatum</th>
      <th scope="col">Status</th>
      <th scope="col">Aktion</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="careRequest : ${careRequests}">
      <td th:text="${careRequest.pet.name}">Bello</td>
      <td th:text="${#temporals.format(careRequest.startDate, 'dd.MM.yyyy')}">20.05.2026</td>
      <td th:text="${#temporals.format(careRequest.endDate, 'dd.MM.yyyy')}">27.05.2026</td>
      <td>
        <span th:switch="${careRequest.status.name()}">
          <span th:case="'OPEN'" class="status-badge status-open">Offen</span>
          <span th:case="'MATCHED'" class="status-badge status-matched">Vermittelt</span>
          <span th:case="'CLOSED'" class="status-badge status-closed">Geschlossen</span>
          <span th:case="*" class="status-badge">Unbekannt</span>
        </span>
      </td>
      <td>
        <a th:href="@{/owner/care-requests/{id}/offers(id=${careRequest.id})}">Angebote ansehen</a>
      </td>
    </tr>
    </tbody>
  </table>
</section>
</body>
</html>
