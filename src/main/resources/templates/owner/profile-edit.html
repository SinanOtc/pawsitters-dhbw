<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
  <title>Profil bearbeiten</title>
</head>
<body>
<section>
  <h1>Profil bearbeiten</h1>

  <form th:action="@{/owner/profile/edit}" th:object="${updateForm}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <p>
      <label for="firstName">Vorname</label>
      <input type="text" th:field="*{firstName}" required>
      <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
            class="field-error"></span>
    </p>

    <p>
      <label for="lastName">Nachname</label>
      <input type="text" th:field="*{lastName}" required>
      <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
            class="field-error"></span>
    </p>

    <p>
      <label for="address">Adresse</label>
      <input type="text" th:field="*{address}" required>
      <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
            class="field-error"></span>
    </p>

    <button type="submit">Speichern</button>
  </form>

  <p><a th:href="@{/owner/profile}">Abbrechen</a></p>
</section>
</body>
</html>
