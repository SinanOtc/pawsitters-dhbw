<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head>
  <title>Profil bearbeiten</title>
</head>
<body>
<section>
  <h1>Profil bearbeiten</h1>

  <form th:action="@{/owner/profile/edit}" th:object="${updateForm}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <p>
      <label for="firstName">Vorname</label>
      <input type="text"
             th:field="*{firstName}"
             autocomplete="given-name"
             maxlength="100"
             required>
      <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
            class="field-error"></span>
    </p>

    <p>
      <label for="lastName">Nachname</label>
      <input type="text"
             th:field="*{lastName}"
             autocomplete="family-name"
             maxlength="100"
             required>
      <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
            class="field-error"></span>
    </p>

    <input type="hidden" th:field="*{address}" data-composed-address>

    <p>
      <label for="street">Straße</label>
      <input type="text"
             id="street"
             autocomplete="address-line1"
             data-address-field="street"
             maxlength="100"
             required>
    </p>

    <p>
      <label for="streetNumber">Straßennummer</label>
      <input type="text"
             id="streetNumber"
             autocomplete="address-line2"
             data-address-field="streetNumber"
             maxlength="20"
             required>
    </p>

    <p>
      <label for="postalCode">PLZ</label>
      <input type="text"
             id="postalCode"
             autocomplete="postal-code"
             inputmode="numeric"
             data-address-field="postalCode"
             pattern="[0-9]{5}"
             required>
    </p>

    <p>
      <label for="city">Ort</label>
      <input type="text"
             id="city"
             autocomplete="address-level2"
             data-address-field="city"
             maxlength="100"
             required>
      <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}"
            class="field-error"></span>
    </p>

    <div class="form-actions">
      <button type="submit">Speichern</button>
      <a th:href="@{/owner/profile}">Abbrechen</a>
    </div>
  </form>
  <script th:src="@{/js/owner-address.js}"></script>
</section>
</body>
</html>
